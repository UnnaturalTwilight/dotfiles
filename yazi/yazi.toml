#:schema https://yazi-rs.github.io/schemas/yazi.json

[[plugin.prepend_preloaders]]
mime = "{audio,video,image}/*"
run = "mediainfo"

[[plugin.prepend_previewers]]
mime = "{audio,video,image}/*"
run = "mediainfo"

[[plugin.prepend_fetchers]]
group = "git"
url = "*"
run  = "git"

[[plugin.prepend_fetchers]]
group = "git"
url = "*/"
run  = "git"

[opener]
edit = [
    { run = "${EDITOR:-nano} %s", desc = "Edit", block = true, for = "unix" },
    { run = "%EDITOR% %s", desc = "Edit", block = true, for = "windows" },
]
code = [
    { run = "code %s", desc = "Code", for = "windows", orphan = true },
    { run = "zeditor %s", desc = "Zed", for = "linux", orphan = true },
]
view-bat = [
    { run = "bat --color=always --paging=always --italic-text=always --pager=less -- %s", desc = "Preview (bat)", block = true, for = "linux" },
]
view-image = [
    { run = "kitty kitten icat --hold -- %s", desc = "Preview (icat)", block = false, for = "linux" },
]
diff-kitty = [
    { run = "kitty kitten diff -- %s1 %s2; echo %d", desc = "Diff (Kitty)", block = false, for = "linux", orphan = true },
]
orcaslicer = [
    { run = "orca-slicer %s1", desc = "OrcaSlicer", block = false, for = "linux", orphan = true },
]

[open]
prepend_rules = [
    # Bulk operations
    { url = "bulk-rename.txt", use = "edit" },
    { url = "bulk-create.txt", use = "edit" },
    # Trash
    { url = "trash://*", use = [ "trash", "open" ] },
    { url = "trash://*/", use = [ "trash", "reveal" ] },
    # 3D models
    { url = "*.{stl,3mf,step}", use = [ "orcaslicer", "reveal"] },
    # Images
    { mime = "image/*", use = [ "view-image", "open", "reveal" ] },
    # Text files
    { mime = "text/*", use = [ "edit", "view-bat", "diff-kitty", "reveal" ] },
    { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "view-bat", "diff-kitty", "reveal" ] },
]
append_rules = [
    # Folders
    { url = "*/", use = [ "open", "code", "reveal" ] },
    # Default
    { url = "*", use = [ "open", "edit", "code", "reveal" ] },
]

[input]
cursor_blink = true
