
[[plugin.prepend_preloaders]]
mime = "{audio,video,image}/*" 
run = "mediainfo"

[[plugin.prepend_previewers]]
mime = "{audio,video,image}/*"
run = "mediainfo"

[[opener.bulk-rename]]
run   = "kitty kitten edit-in-kitty %s"
block = true

[[open.prepend_rules]]
url = "bulk-rename.txt"
use = "bulk-rename"

[[plugin.prepend_fetchers]]
id   = "git"
url = "*"
run  = "git"

[[plugin.prepend_fetchers]]
id   = "git"
url = "*/"
run  = "git"

[opener]
edit = [
	{ run = "$EDITOR %s", desc = "Edit", block = true, for = "unix" },
	{ run = "%EDITOR% %s", desc = "Edit", block = true, for = "windows" },
]
code = [
    { run = "code %s", desc = "VSCode", for = "windows", orphan = true },
]

[open]
prepend_rules = [
	{ mime = "folder/", use = [ "reveal", "code" ] },
]
append_rules = [
	{ url = "*", use = [ "open", "edit", "code", "reveal" ] },
]
