name = "power"
name_pretty = "Power"
icon = "cs-power"
global_search = true
search_name = true
fixed_order = true

[[entries]]
text = "Shutdown"
subtext = "systemctl poweroff"
keywords = ["poweroff", "power"]
icon = "system-shutdown"
actions = { "poweroff" = "systemctl poweroff", "force" = "systemctl poweroff -i" }

[[entries]]
text = "Reboot"
subtext = "systemctl reboot"
keywords = ["restart", "power"]
icon = "system-reboot"
actions = { "reboot" = "systemctl reboot" }

[[entries]]
text = "Lock"
subtext = "Quickshell Lockscreen"
keywords = ["power"]
icon = "system-lock-screen"
actions = { "lock" = "qs -c niri-backdrop ipc call lock lock" }

[[entries]]
text = "Sleep"
subtext = "suspend-then-hibernate"
keywords = ["suspend", "power"]
icon = "system-suspend"
actions = { "suspend" = "qs -c niri-backdrop ipc call idle setState suspend" }

[[entries]]
text = "Hibernate"
subtext = "hibernate"
keywords = ["power"]
icon = "system-suspend-hibernate"
actions = { "hibernate" = "qs -c niri-backdrop ipc call idle setState hibernate" }
